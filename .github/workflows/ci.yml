name: CI - Docker y GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Definir nombres de imagen
        id: image
        shell: bash
        run: |
          # Nombre para GHCR (en minúsculas)
          echo "ghcr_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Nombre para Docker Hub (
          echo "dockerhub_name=francovalli/devops-dds" >> "$GITHUB_OUTPUT"

      - name: Construir imagen Docker
        run: docker build -t dds-devops-demo:test .

      - name: Verificar funcionamiento
        run: |
          docker run -d --name web-test \
            -p 127.0.0.1:8080:80 \
            dds-devops-demo:test
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q "Hola DevOps"; then
              echo "Prueba exitosa"
              exit 0
            fi
            sleep 1
          done
          docker logs web-test
          exit 1

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Etiquetar imágenes para GHCR
        run: |
          IMAGE_GHCR="${{ steps.image.outputs.ghcr_name }}"
          COMMIT_TAG="${GITHUB_SHA::7}"
          
          docker tag dds-devops-demo:test "$IMAGE_GHCR:$COMMIT_TAG"
          docker tag dds-devops-demo:test "$IMAGE_GHCR:latest"

      - name: Etiquetar imágenes para Docker Hub
        run: |
          IMAGE_DH="${{ steps.image.outputs.dockerhub_name }}"
          COMMIT_TAG="${GITHUB_SHA::7}"
          
          docker tag dds-devops-demo:test "$IMAGE_DH:$COMMIT_TAG"
          docker tag dds-devops-demo:test "$IMAGE_DH:latest"

      - name: Publicar imágenes en GHCR
        run: |
          IMAGE_GHCR="${{ steps.image.outputs.ghcr_name }}"
          COMMIT_TAG="${GITHUB_SHA::7}"
          
          docker push "$IMAGE_GHCR:$COMMIT_TAG"
          docker push "$IMAGE_GHCR:latest"

      - name: Publicar imágenes en Docker Hub
        run: |
          IMAGE_DH="${{ steps.image.outputs.dockerhub_name }}"
          COMMIT_TAG="${GITHUB_SHA::7}"
          
          docker push "$IMAGE_DH:$COMMIT_TAG"
          docker push "$IMAGE_DH:latest"